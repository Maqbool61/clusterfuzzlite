# action.yml
name: 'run-fuzzers'
description: 'Runs fuzz target binaries.'
inputs:
  language:
    description: 'Programming language project is written in.'
    required: false
    default: 'c++'
  fuzz-seconds:
    description: 'The total time allotted for fuzzing in seconds.'
    required: true
    default: 600
  dry-run:
    description: 'If set, run the action without actually reporting a failure.'
    default: false
  sanitizer:
    description: 'The sanitizer to run the fuzzers with.'
    default: 'address'
  mode:
    description: |
      The mode to run the fuzzers with ("code-change", "batch", "coverage", or "prune").
      "code-change" is for fuzzing a pull request or commit.
      "batch" is for non-interactive fuzzing of an entire project.
      "coverage" is for coverage generation.
      "prune" is for corpus pruning.
    required: false
    default: 'code-change'
  github-token:
    description: |
      Token for GitHub API.
      You should use "secrets.GITHUB_TOKEN" in your workflow file, do not
      hardcode the token.
    required: true
  storage-repo:
    description: |
      The git repo to use for storing certain artifacts from fuzzing.
    required: false
  storage-repo-branch:
    description: |
      The branch of the git repo to use for storing certain artifacts from
      fuzzing.
    default: main
    required: false
  storage-repo-branch-coverage:
    description: |
      The branch of the git repo to use for storing coverage reports.
    default: gh-pages
    required: false
  report-unreproducible-crashes:
    description: 'If True, then unreproducible crashes will be reported.'
    required: false
    default: False
  minimize-crashes:
    description: 'If True, reportable crashes will be minimized.'
    required: false
    default: False
  parallel-fuzzing:
    description: "Whether to use all available cores for fuzzing."
    required: false
    default: false
  output-sarif:
    description: "Whether to output fuzzing results to SARIF."
    required: false
    default: false
  report-timeouts:
    description: "Whether to report fails due to timeout."
    required: false
    default: true
  report-ooms:
    description: "Whether to report fails due to OOM."
    required: false
    default: true
runs:
  using: 'composite'
  steps:
    # js-sanitizer-none patch (EGC#910 / google/oss-fuzz#15907):
    # config_utils.py rejects SANITIZER=none but compile requires it for JS projects.
    # Add 'none' to the SANITIZERS allowlist before the entrypoint validates it.
    - name: Patch CIFuzz sanitizer allowlist for JavaScript
      if: ${{ inputs.language == 'javascript' && inputs.sanitizer == 'none' }}
      shell: bash
      run: |
        docker pull gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers:v1
        docker run --rm \
          --entrypoint /bin/bash \
          -e FUZZ_SECONDS="${{ inputs.fuzz-seconds }}" \
          -e MODE="${{ inputs.mode }}" \
          -e LANGUAGE="${{ inputs.language }}" \
          -e DRY_RUN="${{ inputs.dry-run }}" \
          -e SANITIZER="${{ inputs.sanitizer }}" \
          -e GITHUB_TOKEN="${{ inputs.github-token }}" \
          -e LOW_DISK_SPACE="True" \
          -e GIT_STORE_REPO="${{ inputs.storage-repo }}" \
          -e GIT_STORE_BRANCH="${{ inputs.storage-repo-branch }}" \
          -e GIT_STORE_BRANCH_COVERAGE="${{ inputs.storage-repo-branch-coverage }}" \
          -e REPORT_UNREPRODUCIBLE_CRASHES="${{ inputs.report-unreproducible-crashes }}" \
          -e OUTPUT_SARIF="${{ inputs.output-sarif }}" \
          -e MINIMIZE_CRASHES="${{ inputs.minimize-crashes }}" \
          -e CFL_PLATFORM="github" \
          -e PARALLEL_FUZZING="${{ inputs.parallel-fuzzing }}" \
          -e REPORT_TIMEOUTS="${{ inputs.report-timeouts }}" \
          -e REPORT_OOMS="${{ inputs.report-ooms }}" \
          -v "$GITHUB_WORKSPACE:/github/workspace" \
          -e GITHUB_WORKSPACE=/github/workspace \
          -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          -e GITHUB_SHA="$GITHUB_SHA" \
          -e GITHUB_REF="$GITHUB_REF" \
          -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
          gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers:v1 \
          -c "sed -i \"s/SANITIZERS = \['address', 'memory', 'undefined', 'coverage'\]/SANITIZERS = ['address', 'memory', 'undefined', 'coverage', 'none']/\" /opt/oss-fuzz/infra/cifuzz/config_utils.py && python3 /opt/oss-fuzz/infra/cifuzz/run_fuzzers_entrypoint.py"

    - name: Run Fuzzers (standard path)
      if: ${{ !(inputs.language == 'javascript' && inputs.sanitizer == 'none') }}
      uses: docker://gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers:v1
      env:
        FUZZ_SECONDS: ${{ inputs.fuzz-seconds }}
        MODE: ${{ inputs.mode }}
        LANGUAGE: ${{ inputs.language }}
        DRY_RUN: ${{ inputs.dry-run }}
        SANITIZER: ${{ inputs.sanitizer }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LOW_DISK_SPACE: 'True'
        GIT_STORE_REPO: ${{ inputs.storage-repo }}
        GIT_STORE_BRANCH: ${{ inputs.storage-repo-branch }}
        GIT_STORE_BRANCH_COVERAGE: ${{ inputs.storage-repo-branch-coverage }}
        REPORT_UNREPRODUCIBLE_CRASHES: ${{ inputs.report-unreproducible-crashes }}
        OUTPUT_SARIF: ${{ inputs.output-sarif }}
        MINIMIZE_CRASHES: ${{ inputs.minimize-crashes }}
        CFL_PLATFORM: 'github'
        PARALLEL_FUZZING: ${{ inputs.parallel-fuzzing }}
        REPORT_TIMEOUTS: ${{ inputs.report-timeouts }}
        REPORT_OOMS: ${{ inputs.report-ooms }}
